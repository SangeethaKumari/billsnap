name: AI Agent Core CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Lint, Typecheck, and Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install uv execution tool
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up runtime Python platform
        run: uv python install 3.13

      - name: Install package and developer toolchain dependencies
        run: uv sync

      - name: Automated Lint Code Review (Ruff Check)
        run: uv run ruff check backend/src

      - name: Automated Format Verification style matching
        run: uv run ruff format --check backend/src

      - name: Pyright Static Type System Verification
        run: uv run pyright

  frontend-build:
    name: Build React Client Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Node.js workspace environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Fetch client node modules packages
        run: |
          cd frontend
          npm install

      - name: Build production optimized browser assets compile
        run: |
          cd frontend
          npm run build
