[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name            = "documentscan"
version         = "0.1.0"
description     = "Scan billing documents"
readme          = "README.md"
requires-python = ">=3.13"
dependencies    = [
    "fastapi>=0.138.1",
    "fastmcp>=3.4.2",
    "uvicorn[standard]>=0.49.0",
    "google-adk>=2.3.0",
    "google-genai>=0.1.1",
    "google-cloud-aiplatform>=1.158.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.51",
    "psycopg2-binary>=2.9.12",
    "networkx>=3.6.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.0",
    "openai>=2.44.0",
    "anthropic>=0.112.0",
    "aiohttp>=3.14.1",
    "lxml>=6.1.1",
    "pypdf>=6.14.2",
    "arize-phoenix>=4.0.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
]

# Exposes direct run scripts commands mapping via pyproject targets
[project.scripts]
serve      = "documentscan.main:app"
mcp-server = "documentscan.server:mcp"
ingest     = "documentscan.ingestion.parser:main"
eval       = "documentscan.evals.runner:main"

[tool.uv]
package = true
dev-dependencies = [
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    "notebook>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/documentscan"]

[tool.hatch.build]
dev-mode-dirs = ["backend/src"]

[tool.pyright]
useLibraryCodeForTypes = true
include = ["backend/src"]
